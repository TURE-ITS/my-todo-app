<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Prevents Browsers From Caching Old Code -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Login - ToDo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Hide native browser password reveal icons (Edge, Chrome, IE) */
    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Welcome Back</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to access your task workspace.</p>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Email</label>
        <input type="email" id="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="name@company.com">
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg pl-3 pr-10 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 cursor-pointer focus:outline-none p-1 flex items-center justify-center" title="Toggle password visibility">
            
            <!-- Eye Open Icon (Visible when password is hidden) -->
            <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12c1.76-3.47 5.097-6 9.043-6 3.946 0 7.283 2.53 9.043 6-1.76 3.47-5.097 6-9.043 6-3.946 0-7.283-2.53-9.043-6z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>

            <!-- Eye Off Icon (Visible when password is plain text) -->
            <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>

          </button>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="submit" onclick="authAction='login'" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm shadow-sm transition cursor-pointer">Log In</button>
        <button type="submit" onclick="authAction='signup'" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-lg text-sm transition cursor-pointer">Sign Up</button>
      </div>
    </form>

    <!-- Alert Box -->
    <div id="msg" style="display: none;" class="text-xs text-center mt-4 p-2.5 rounded-lg font-medium"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const SUPABASE_URL = "https://fdizymhojsdsnyikmlir.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkaXp5bWhvanNkc255aWttbGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2ODA5MTYsImV4cCI6MjEwMjI1NjkxNn0.s7f1m5FKauWVHF7viJyA5YrnfLX42wdzu9mRIi48JxE";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let authAction = 'login';
    let msgTimer = null;

    async function checkExistingSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        window.location.href = './';
      }
    }
    checkExistingSession();

    // Toggle Password Visibility via CSS class toggle
    function togglePassword() {
      const passInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eye-open');
      const eyeClosed = document.getElementById('eye-closed');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      } else {
        passInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
      }
    }

    function showNotification(text, styleClasses) {
      const msg = document.getElementById('msg');
      if (msgTimer) clearTimeout(msgTimer);

      msg.textContent = text;
      msg.className = `text-xs text-center mt-4 p-2.5 rounded-lg font-medium ${styleClasses}`;
      msg.style.display = 'block';

      msgTimer = setTimeout(() => {
        msg.style.display = 'none';
      }, 2000);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      let res;
      if (authAction === 'signup') {
        res = await db.auth.signUp({ email, password });
      } else {
        res = await db.auth.signInWithPassword({ email, password });
      }

      if (res.error) {
        showNotification(res.error.message, 'bg-red-50 text-red-700 border border-red-200');
      } else {
        if (authAction === 'signup') {
          showNotification('Account created! Logging in...', 'bg-green-50 text-green-700 border border-green-200');
        } else {
          showNotification('Success! Redirecting to dashboard...', 'bg-indigo-50 text-indigo-700 border border-indigo-200');
          setTimeout(() => {
            window.location.href = './';
          }, 800);
        }
      }
    }
  </script>
</body>
</html>
