<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Prevents Browsers From Caching Old Code -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Login - ToDo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Welcome Back</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to access your task workspace.</p>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Email</label>
        <input type="email" id="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="name@company.com">
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Password</label>
        <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
      </div>

      <div class="flex gap-2 pt-2">
        <button type="submit" onclick="authAction='login'" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm shadow-sm transition cursor-pointer">Log In</button>
        <button type="submit" onclick="authAction='signup'" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-lg text-sm transition cursor-pointer">Sign Up</button>
      </div>
    </form>

    <div id="msg" class="text-xs text-center mt-4 p-2.5 rounded-lg hidden font-medium"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://fdizymhojsdsnyikmlir.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkaXp5bWhvanNkc255aWttbGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2ODA5MTYsImV4cCI6MjEwMjI1NjkxNn0.s7f1m5FKauWVHF7viJyA5YrnfLX42wdzu9mRIi48JxE";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let authAction = 'login';

    // Auto-redirect if user is already logged in
    async function checkExistingSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    }
    checkExistingSession();

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      
      msg.className = "text-xs text-center mt-4 p-2.5 rounded-lg font-medium";

      let res;
      if (authAction === 'signup') {
        res = await db.auth.signUp({ email, password });
      } else {
        res = await db.auth.signInWithPassword({ email, password });
      }

      if (res.error) {
        msg.textContent = res.error.message;
        msg.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
      } else {
        if (authAction === 'signup') {
          msg.textContent = "Account created! You can now log in.";
          msg.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
        } else {
          msg.textContent = "Success! Redirecting to dashboard...";
          msg.classList.add('bg-indigo-50', 'text-indigo-700', 'border', 'border-indigo-200');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        }
      }
    }
  </script>
</body>
</html>
