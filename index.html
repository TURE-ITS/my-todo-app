<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Prevents Browsers From Caching Old Code -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>ToDo Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased min-h-screen">

  <!-- Main Container -->
  <div class="max-w-5xl mx-auto px-4 py-8">
    
    <!-- Header Bar -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Tasks Dashboard</h1>
        <p class="text-sm text-gray-500 mt-1">Manage team priorities and track deliverables live.</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition flex items-center gap-2 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          New Task
        </button>
        <button onclick="logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2.5 rounded-lg transition text-sm cursor-pointer">
          Log Out
        </button>
      </div>
    </div>

    <!-- Category & Status Filter Tabs -->
    <div class="flex flex-wrap gap-2 mb-6 border-b border-gray-200 pb-4" id="filter-tabs">
      <button onclick="setFilter('all')" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium bg-indigo-50 text-indigo-700" data-filter="all">All Tasks</button>
      <button onclick="setFilter('today')" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100" data-filter="today">Today</button>
      <button onclick="setFilter('high')" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100" data-filter="high">High Priority</button>
      <button onclick="setFilter('Work')" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100" data-filter="Work">Work</button>
      <button onclick="setFilter('Personal')" class="filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100" data-filter="Personal">Personal</button>
    </div>

    <!-- Task Cards Grid -->
    <div id="task-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-gray-400 italic col-span-2">Loading tasks from Supabase...</p>
    </div>

  </div>

  <!-- Add Task Modal -->
  <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Create New Task</h3>
        <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="add-task-form" onsubmit="createTask(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Task Name *</label>
          <input type="text" id="form-task-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="e.g., Deploy updates">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Details</label>
          <textarea id="form-task-details" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Task description..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Priority</label>
            <select id="form-priority" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="High">🔴 High</option>
              <option value="Medium" selected>🟠 Medium</option>
              <option value="Low">🔵 Low</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
            <select id="form-category" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Personal" selected>Personal</option>
              <option value="Work">Work</option>
              <option value="Finance">Finance</option>
              <option value="Health">Health</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Due Date</label>
          <input type="date" id="form-due-date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    const SUPABASE_URL = "https://fdizymhojsdsnyikmlir.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkaXp5bWhvanNkc255aWttbGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2ODA5MTYsImV4cCI6MjEwMjI1NjkxNn0.s7f1m5FKauWVHF7viJyA5YrnfLX42wdzu9mRIi48JxE";

    function toggleModal(show) {
      const modal = document.getElementById('modal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auth Guard: Kicks user to login page if unauthenticated
    async function checkAuth() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = 'login';
      } else {
        fetchTasks();
      }
    }

    // Log Out Action
    async function logout() {
      await db.auth.signOut();
      window.location.href = 'login';
    }

    let allTasks = [];
    let currentFilter = 'all';

    // Fetch Tasks
    async function fetchTasks() {
      if (!db) return;

      const { data, error } = await db
        .from('todos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error fetching data:', error);
        document.getElementById('task-grid').innerHTML = `<p class="text-red-500 col-span-2">Failed to load tasks: ${error.message}</p>`;
        return;
      }

      allTasks = data || [];
      renderTasks();
    }

    // Render Tasks
    function renderTasks() {
      const grid = document.getElementById('task-grid');
      grid.innerHTML = '';

      const filtered = allTasks.filter(t => {
        if (currentFilter === 'today') {
          const todayStr = new Date().toISOString().split('T')[0];
          return t.due_date === todayStr;
        }
        if (currentFilter === 'high') return t.priority === 'High';
        if (['Work', 'Personal', 'Finance', 'Health'].includes(currentFilter)) {
          return t.category === currentFilter;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="text-gray-400 italic col-span-2 py-8 text-center bg-white rounded-xl border border-gray-200">No tasks found for this view.</p>`;
        return;
      }

      filtered.forEach(t => {
        const priorityColors = {
          High: 'bg-red-50 text-red-700 border-red-200',
          Medium: 'bg-amber-50 text-amber-700 border-amber-200',
          Low: 'bg-blue-50 text-blue-700 border-blue-200'
        };

        const isDone = t.is_completed;

        const card = document.createElement('div');
        card.className = `bg-white border rounded-xl p-4 shadow-sm transition hover:shadow-md relative flex flex-col justify-between ${isDone ? 'opacity-60 bg-gray-50' : 'border-gray-200'}`;
        
        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-3 mb-2">
              <div class="flex items-center gap-3">
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleComplete(${t.id}, ${!isDone})" 
                  class="w-5 h-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer">
                <h4 class="font-semibold text-gray-900 ${isDone ? 'line-through text-gray-400' : ''}">
                  ${t.task_name || t.task || 'Untitled Task'}
                </h4>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full font-medium border ${priorityColors[t.priority] || priorityColors.Medium}">
                ${t.priority || 'Medium'}
              </span>
            </div>
            ${t.task && t.task_name ? `<p class="text-xs text-gray-500 ml-8 mb-3">${t.task}</p>` : ''}
          </div>

          <div class="flex items-center justify-between text-xs text-gray-400 pt-3 border-t border-gray-100 mt-2">
            <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-medium">${t.category || 'Personal'}</span>
            <div class="flex items-center gap-3">
              <span>📅 ${t.due_date || 'No due date'}</span>
              <button onclick="deleteTask(${t.id})" class="text-gray-400 hover:text-red-600 transition cursor-pointer" title="Delete Task">
                🗑️
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Create Task (Attached to logged-in user)
    async function createTask(e) {
      e.preventDefault();
      if (!db) return;

      const { data: { user } } = await db.auth.getUser();

      const task_name = document.getElementById('form-task-name').value;
      const task = document.getElementById('form-task-details').value;
      const priority = document.getElementById('form-priority').value;
      const category = document.getElementById('form-category').value;
      const due_date = document.getElementById('form-due-date').value || null;

      const { error } = await db.from('todos').insert([{
        task_name,
        task,
        priority,
        category,
        due_date,
        user_id: user.id,
        is_completed: false
      }]);

      if (error) {
        alert('Error creating task: ' + error.message);
      } else {
        toggleModal(false);
        document.getElementById('add-task-form').reset();
        fetchTasks();
      }
    }

    // Toggle Complete
    async function toggleComplete(id, nextState) {
      if (!db) return;
      await db.from('todos').update({ is_completed: nextState }).eq('id', id);
      fetchTasks();
    }

    // Delete Task
    async function deleteTask(id) {
      if (!db) return;
      if (confirm('Are you sure you want to delete this task?')) {
        await db.from('todos').delete().eq('id', id);
        fetchTasks();
      }
    }

    // Filter Switcher
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = 'filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium bg-indigo-50 text-indigo-700';
        } else {
          btn.className = 'filter-btn px-3.5 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100';
        }
      });
      renderTasks();
    }

    // Run Auth Guard on load
    checkAuth();
  </script>
</body>
</html>
